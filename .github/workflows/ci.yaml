name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - run: uv pip install --system -r requirements-dev.txt
      - run: ruff check .

      # The cross-language contract artifacts are generated from Python sources
      # (schemas/companion.py, compute/indicators.py, price_sync.py) and
      # consumed by the separate companion app and by the web frontend.
      # Regenerate them here and fail if anything moves: a dirty tree means
      # someone edited a source without re-exporting, so the artifact the
      # consumer reads no longer describes this backend.
      - name: Contract artifacts are in sync with their sources
        run: |
          python -m scripts.export_companion_schema
          python -m scripts.export_indicator_contract
          python -m scripts.export_shared_constants
          # `:/` anchors the pathspec to the repo root. The exporters write to
          # __file__-relative paths, so the artifacts land where they belong
          # (two in backend/, the constants module in frontend/) regardless of
          # cwd — but a plain cwd-relative spec would silently match nothing,
          # and so pass, for whichever of the two trees we are not standing in.
          # This survives the step moving to a job without the
          # working-directory default above.
          # `git status --porcelain`, not `git diff`: diff only compares tracked
          # files, so an exporter that starts emitting a *new* artifact would
          # leave it untracked and the check would pass while the consumer has
          # nothing to read. status reports untracked paths too.
          DRIFT=$(git status --porcelain -- :/backend/companion.schema.json :/backend/indicator.contract.json :/backend/indicator.fixtures.json :/frontend/src/lib/generated/)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            git diff -- :/backend/companion.schema.json :/backend/indicator.contract.json :/backend/indicator.fixtures.json :/frontend/src/lib/generated/
            echo "::error::Contract artifacts are stale. Run the three export scripts in backend/ and commit the result (then copy the companion/indicator ones into fibenchi-app/)."
            exit 1
          fi

      - run: pytest
      - run: uv pip install --system pip-audit
      - run: pip-audit -r requirements.txt

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm audit --prod || true

  build-image:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
