# pnpm 11 blocks dependency postinstall scripts unless they are allowed here.
#
# esbuild: needs its postinstall to place the platform binary — vite's transform
#   step shells out to it, so a blocked build breaks `pnpm build` outright.
# msw: only a transitive optional peer of vitest. Nothing imports it and there
#   is no public/mockServiceWorker.js, so its service-worker install is dead
#   weight. Flip to true if we ever adopt msw for request mocking.
allowBuilds:
  esbuild: true
  msw: false
